name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter database exec prisma generate --schema=prisma/schema.prisma
      - name: Typecheck and test API
        run: |
          pnpm --filter api exec tsc --noEmit
          pnpm --filter api test

  parser:
    name: Parser worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.111.0" "uvicorn[standard]>=0.30.0" "pydantic>=2.7.0" \
            "python-multipart>=0.0.9" "httpx>=0.28.0" "pypdf>=5.0.0" \
            "python-docx>=1.1.0" "python-pptx>=1.0.0" "openpyxl>=3.1.0" \
            "xlrd>=2.0.1" "minio>=7.2.7" pytest
      - name: Run tests
        working-directory: apps/parser-worker
        env:
          PYTHONPATH: src
        run: python -m pytest tests/ -q
      # P2 toolchain gates: ruff (correctness rules, line-length 100) + mypy
      # baseline. Pins live in apps/parser-worker/requirements.lock.txt.
      - name: Ruff lint (parser-worker)
        working-directory: apps/parser-worker
        run: |
          python -m pip install "ruff==0.14.5"
          ruff check src tests
      - name: Mypy baseline (parser-worker)
        working-directory: apps/parser-worker/src
        run: |
          python -m pip install "mypy==1.18.2"
          mypy --explicit-package-bases --namespace-packages main.py quality.py extractors

  adapter:
    name: GBrain adapter contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @llmwiki/gbrain-adapter build
      - run: node --test packages/gbrain-adapter/run-contract.test.cjs

  web:
    name: Web typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec tsc --noEmit
      # Unit tests for pure helpers (node:test via tsx — no heavy test runner).
      - name: Web unit tests
        run: pnpm --filter web test

  # Unified release-gate pipeline (scripts/ci.sh) — same entrypoint that
  # deploy-prod.sh runs before any production rsync. Needs no secrets: the
  # e2e/IR layers self-skip without tokens and print a GATE_STRICT warning.
  # Keep this job aligned with local `GATE_STRICT=1 bash scripts/ci.sh`.
  unified-ci:
    name: Unified CI pipeline (scripts/ci.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Install parser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.111.0" "uvicorn[standard]>=0.30.0" "pydantic>=2.7.0" \
            "python-multipart>=0.0.9" "httpx>=0.28.0" "pypdf>=5.0.0" \
            "python-docx>=1.1.0" "python-pptx>=1.0.0" "openpyxl>=3.1.0" \
            "xlrd>=2.0.1" "minio>=7.2.7" pytest
      - name: Run unified CI gate
        env:
          GATE_STRICT: "1"
        run: bash scripts/ci.sh

  # Offline evaluation tooling: metric maths, qrels scoring, result parsers and
  # the load-test harness all have dependency-free selftests. They need no
  # corpus, no database and no credentials, so a broken evaluation harness fails
  # the build instead of being discovered at release time (the "framework is
  # complete but was never actually run" failure mode).
  evaluation:
    name: Evaluation harness selftests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Metric + pipeline selftests
        working-directory: tests/evaluation
        run: |
          set -euo pipefail
          python intl-benchmark/standard_ir_eval.py --selftest
          python intl-benchmark/beir_pipeline.py --selftest
          python intl-benchmark/benchmark_suite.py --selftest
          python intl-benchmark/ann_recall_eval.py --selftest
          python intl-benchmark/load_test.py --selftest
          python intl-benchmark/fetch_datasets.py --selftest
      - name: Threshold source of truth is sourced by both gates
        run: |
          set -euo pipefail
          source tests/evaluation/gate-thresholds.sh
          test -n "$GATE_HIT_RATE"
          test -n "$GATE_ANN_RECALL"

  # Full retrieval quality gate. Requires live services + seeded corpus, so it
  # runs on a self-hosted runner (label: llmwiki) and is skipped elsewhere.
  quality-gate:
    name: Retrieval quality gate
    runs-on: [self-hosted, llmwiki]
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run gate
        env:
          API_BASE: ${{ secrets.LLMWIKI_API_URL }}
          LLMWIKI_TOKEN: ${{ secrets.LLMWIKI_TOKEN }}
          GATE_HIT_RATE: "0.90"
          GATE_KEYWORD_COVERAGE: "0.85"
          GATE_PERMISSION_RATE: "1.00"
          GATE_NO_HALLUCINATION: "0.95"
          GATE_FAITHFULNESS: "0.95"
          GATE_CITATION_ACCURACY: "0.90"
          GATE_CONTEXT_PRECISION: "0.85"
        run: bash tests/evaluation/ci-gate.sh
