name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API unit tests
    runs-on: ubuntu-latest
    # Historical migrations require llmwiki + llmwiki_app; these names exist
    # only inside this job's disposable PostgreSQL service, never a remote DB.
    env:
      DATABASE_URL: postgresql://postgres:ci_fixture@127.0.0.1:5432/llmwiki?schema=public
      DATABASE_URL_APP: postgresql://postgres:ci_fixture@127.0.0.1:5432/llmwiki?schema=public
      USER_CREDENTIAL_TEST_DATABASE_URL: postgresql://postgres:ci_fixture@127.0.0.1:5432/llmwiki?schema=public
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_fixture
          POSTGRES_DB: llmwiki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d llmwiki"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      # Read the exact pnpm version from root package.json packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter database exec prisma generate --schema=prisma/schema.prisma
      - name: Initialize isolated test database
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d llmwiki -v ON_ERROR_STOP=1 -c 'CREATE ROLE llmwiki_app NOLOGIN NOSUPERUSER NOBYPASSRLS;'
          pnpm --filter database exec prisma migrate deploy --schema=prisma/schema.prisma
          pnpm --filter database exec prisma migrate status --schema=prisma/schema.prisma
      - name: Build API workspace dependency
        run: pnpm --filter @llmwiki/gbrain-adapter build
      - name: Typecheck and test API
        run: |
          pnpm --filter api exec tsc --noEmit
          pnpm --filter api lint
          pnpm --filter api test

  parser:
    name: Parser worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.111.0" "uvicorn[standard]>=0.30.0" "pydantic>=2.7.0" \
            "python-multipart>=0.0.9" "httpx>=0.28.0" "pypdf>=5.0.0" \
            "python-docx>=1.1.0" "python-pptx>=1.0.0" "openpyxl>=3.1.0" \
            "xlrd>=2.0.1" "minio>=7.2.7" "numpy>=1.26,<3" pillow pytest "xlwt==1.3.0"
      - name: Run tests
        working-directory: apps/parser-worker
        env:
          PYTHONPATH: src
        run: python -m pytest tests/ -q
      # P2 toolchain gates: ruff (correctness rules, line-length 100) + mypy
      # baseline. Pins live in apps/parser-worker/requirements.lock.txt.
      - name: Ruff lint (parser-worker)
        working-directory: apps/parser-worker
        run: |
          python -m pip install "ruff==0.14.5"
          ruff check src tests
      - name: Mypy baseline (parser-worker)
        working-directory: apps/parser-worker
        run: |
          python -m pip install "mypy==1.18.2"
          mypy --explicit-package-bases --namespace-packages src

  adapter:
    name: GBrain adapter contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Read the exact pnpm version from root package.json packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @llmwiki/gbrain-adapter build
      - run: node --test packages/gbrain-adapter/run-contract.test.cjs

  web:
    name: Web typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Read the exact pnpm version from root package.json packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec tsc --noEmit
      - run: pnpm --filter web lint
      # Unit tests for pure helpers (node:test via tsx — no heavy test runner).
      - name: Web unit tests
        run: pnpm --filter web test

  # Offline CI. Paid live quality checks require explicit workflow dispatch.
  unified-ci:
    name: Unified CI pipeline (scripts/ci.sh)
    runs-on: ubuntu-latest
    # Historical migrations require llmwiki + llmwiki_app; these names exist
    # only inside this job's disposable PostgreSQL service, never a remote DB.
    env:
      DATABASE_URL: postgresql://postgres:ci_fixture@127.0.0.1:5432/llmwiki?schema=public
      DATABASE_URL_APP: postgresql://postgres:ci_fixture@127.0.0.1:5432/llmwiki?schema=public
      USER_CREDENTIAL_TEST_DATABASE_URL: postgresql://postgres:ci_fixture@127.0.0.1:5432/llmwiki?schema=public
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_fixture
          POSTGRES_DB: llmwiki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d llmwiki"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      # Read the exact pnpm version from root package.json packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Install parser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.111.0" "uvicorn[standard]>=0.30.0" "pydantic>=2.7.0" \
            "python-multipart>=0.0.9" "httpx>=0.28.0" "pypdf>=5.0.0" \
            "python-docx>=1.1.0" "python-pptx>=1.0.0" "openpyxl>=3.1.0" \
            "xlrd>=2.0.1" "minio>=7.2.7" "numpy>=1.26,<3" pillow pytest "xlwt==1.3.0"
      - name: Initialize isolated test database
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d llmwiki -v ON_ERROR_STOP=1 -c 'CREATE ROLE llmwiki_app NOLOGIN NOSUPERUSER NOBYPASSRLS;'
          pnpm --filter database exec prisma migrate deploy --schema=prisma/schema.prisma
          pnpm --filter database exec prisma migrate status --schema=prisma/schema.prisma
      - name: Run unified CI gate
        env:
          GATE_STRICT: "0"
        run: bash scripts/ci.sh

  # Offline evaluation tooling: metric maths, qrels scoring, result parsers and
  # the load-test harness all have dependency-free selftests. They need no
  # corpus, no database and no credentials, so a broken evaluation harness fails
  # the build instead of being discovered at release time (the "framework is
  # complete but was never actually run" failure mode).
  evaluation:
    name: Evaluation harness selftests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Read the exact pnpm version from root package.json packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Complete evaluation harness and threshold selftests
        run: pnpm run benchmark:selftest
