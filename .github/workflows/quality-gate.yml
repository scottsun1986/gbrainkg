name: Quality Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API Unit Tests
        run: cd apps/api && npx jest --ci --coverage --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: ./test-results
      - name: Parser Tests  
        run: cd apps/parser-worker && python3 -m pytest tests/ --junitxml=test-results/pytest.xml
      - name: Contract Tests
        run: node packages/gbrain-adapter/run-contract.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/test-results/'

  retrieval-quality:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest requests sseclient-py
      - name: Run Retrieval Quality Evaluation
        run: python -m pytest tests/evaluation/test_retrieval_quality.py --junitxml=eval-results.xml -v
        env:
          TEST_HOST: ${{ secrets.TEST_HOST }}
          TEST_PORT: ${{ secrets.TEST_PORT }}
      - name: Quality Gate Check
        run: python tests/evaluation/quality_gate.py --threshold-hit-rate 0.80 --threshold-faithfulness 0.95
