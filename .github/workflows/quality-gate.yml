name: Explicit Strict Quality Gate

# Live evaluations call models and write fixtures. Only an explicit test run
# enables this workflow; ordinary pushes and PRs run the offline CI workflow.
on:
  workflow_dispatch:

jobs:
  strict-test-quality:
    runs-on: [self-hosted, llmwiki-test]
    environment: test
    steps:
      - uses: actions/checkout@v4
      # Read the exact pnpm version from root package.json packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - name: Install parser test dependencies
        run: >-
          python -m pip install "fastapi>=0.111.0" "uvicorn[standard]>=0.30.0"
          "pydantic>=2.7.0" "python-multipart>=0.0.9" "httpx>=0.28.0"
          "pypdf>=5.0.0" "python-docx>=1.1.0" "python-pptx>=1.0.0"
          "openpyxl>=3.1.0" "xlrd>=2.0.1" "minio>=7.2.7" "numpy>=1.26,<3" pillow pytest "xlwt==1.3.0"
      - name: Require explicit test target and credentials
        env:
          API_BASE: ${{ secrets.LLMWIKI_TEST_API_URL }}
          LLMWIKI_TOKEN: ${{ secrets.LLMWIKI_TEST_TOKEN }}
        run: |
          test -n "$API_BASE"
          test -n "$LLMWIKI_TOKEN"
          python3 scripts/assert-test-target.py "$API_BASE"
      - name: Run strict offline and live gates against test environment
        env:
          GATE_STRICT: "1"
          E2E_REQUIRE_ALL: "1"
          API_BASE: ${{ secrets.LLMWIKI_TEST_API_URL }}
          LLMWIKI_TOKEN: ${{ secrets.LLMWIKI_TEST_TOKEN }}
          TEST_USER: ${{ secrets.LLMWIKI_TEST_USER }}
          TEST_PASSWORD: ${{ secrets.LLMWIKI_TEST_PASSWORD }}
          ANN_EVAL_DATABASE_URL: ${{ secrets.LLMWIKI_TEST_DATABASE_URL }}
          BEIR_QRELS: ${{ vars.BEIR_TEST_QRELS }}
          BEIR_RUN: ${{ vars.BEIR_TEST_RUN }}
        run: bash scripts/ci.sh
