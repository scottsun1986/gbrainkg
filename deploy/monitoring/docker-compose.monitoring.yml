# GBrainKG monitoring stack (Prometheus + Grafana) — docker, no GitHub downloads.
# Usage on host: docker compose -f deploy/monitoring/docker-compose.monitoring.yml up -d
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: gbrainkg-prometheus
    restart: unless-stopped
    user: "65534:65534"
    # host network so 127.0.0.1 scrape targets reach the host API instances
    network_mode: host
    volumes:
      - /etc/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /etc/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=127.0.0.1:9090
      - --web.enable-lifecycle

  grafana:
    image: grafana/grafana:11.2.0
    container_name: gbrainkg-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3300:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - /etc/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
