global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: gbrainkg-prod

rule_files:
  - /etc/prometheus/rules/gbrainkg-alerts.yml

# Alertmanager: routes firing alerts to webhook (企业微信/飞书) via ALERT_WEBHOOK_URL.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

scrape_configs:
  - job_name: gbrainkg-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - '127.0.0.1:3000'
          - '127.0.0.1:3002'
          - '127.0.0.1:3004'
        labels:
          app: llmwiki-api

  - job_name: gbrainkg-web
    metrics_path: /metrics
    static_configs:
      - targets:
          - '127.0.0.1:3200'
          - '127.0.0.1:3202'
        labels:
          app: llmwiki-web
    # Web may not expose /metrics yet; keep scrape soft via honor and relabel drop on error is automatic.

  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  # node_exporter — installed by install-monitoring-docker.sh when INSTALL_EXPORTERS=1
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels:
          app: node-exporter

  # postgres_exporter — installed by install-monitoring-docker.sh when INSTALL_EXPORTERS=1
  - job_name: postgres
    static_configs:
      - targets: ['127.0.0.1:9187']
        labels:
          app: postgres-exporter
