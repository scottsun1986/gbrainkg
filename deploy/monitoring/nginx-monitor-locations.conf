# Monitoring reverse-proxy snippets for knowledge.5gsailor.com:20080
# Included from the llmwiki site (or copy locations inline).
#
# Access:
#   https://knowledge.5gsailor.com:20080/monitor/          landing page
#   https://knowledge.5gsailor.com:20080/monitor/grafana/  Grafana
#   https://knowledge.5gsailor.com:20080/monitor/prometheus/
#
# HTTP basic auth is layered on top of Grafana login. Prometheus has no auth
# of its own — the basic-auth gate is mandatory.

location = /monitor {
    return 301 /monitor/;
}

location /monitor/ {
    auth_basic "monitor";
    auth_basic_user_file /etc/nginx/.htpasswd_monitor;
    alias /var/www/monitor/;
    index index.html;
}

location /monitor/grafana/ {
    auth_basic "monitor";
    auth_basic_user_file /etc/nginx/.htpasswd_monitor;
    # keep the /monitor/grafana prefix: Grafana serves_from_sub_path=true
    proxy_pass http://127.0.0.1:3300;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
}

location = /monitor/grafana {
    return 301 /monitor/grafana/;
}

location /monitor/prometheus/ {
    auth_basic "monitor";
    auth_basic_user_file /etc/nginx/.htpasswd_monitor;
    proxy_pass http://127.0.0.1:9090/monitor/prometheus/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}

location = /monitor/prometheus {
    return 301 /monitor/prometheus/;
}
