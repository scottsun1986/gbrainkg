events {}

http {
  server_tokens off;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 200m;

  limit_req_zone $binary_remote_addr zone=login_limit:10m rate=3r/s;
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

  upstream llmwiki_web { server web:3000; }
  upstream llmwiki_api { server api:3000; }

  server {
    listen 80;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:;" always;

    location = /health {
      proxy_pass http://llmwiki_api/health;
      include /etc/nginx/proxy_params;
    }

    location = /api/v1/auth/login {
      limit_req zone=login_limit burst=5 nodelay;
      proxy_pass http://llmwiki_api;
      include /etc/nginx/proxy_params;
    }

    location /api/ {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_pass http://llmwiki_api;
      include /etc/nginx/proxy_params;
    }

    location / {
      proxy_pass http://llmwiki_web;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      include /etc/nginx/proxy_params;
    }
  }
}
