[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parser-worker"
version = "0.1.0"
description = "Document parsing microservice for LLMWiki"
readme = "README.md"
requires-python = ">=3.10"
# Legacy .doc conversion uses the system/userland antiword executable.
dependencies = [
    "numpy>=1.26.0,<3",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.9",
    "httpx>=0.28.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "pillow>=10.3.0",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "xlwt>=1.3.0", "ruff>=0.9", "mypy>=1.14"]
# PyMuPDF is a pure PDF rasteriser (no model weights). It is required for
# page-level VLM enrichment of PDFs: without it the renderer import fails and the
# enrichment step returns an empty string, which used to look like "the page had
# no visual content".
pdf-render = ["pymupdf>=1.24.0"]
# Local layout/document models (Docling). Intentionally optional: this
# deployment keeps local models out of the production image, so the flag
# LOCAL_DOCLING_ENABLED is only meaningful where this extra is installed.
layout-models = ["docling>=1.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/parser_worker"]

# ---------------------------------------------------------------------------
# P2 toolchain: lint (ruff) + type check (mypy). Baseline first — tighten
# `select` / `strict` incrementally so existing code does not go red overnight.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
# Correctness-class rules only for the P2 baseline. F401 (unused imports) is
# deliberately deferred — existing modules still have a few and main.py is
# under concurrent edit. Style buckets (E501, I, UP, B) can be enabled once
# the baseline is clean.
select = [
    "E9",   # runtime syntax errors
    "F63",  # invalid print/star usage
    "F7",   # syntax errors in py2/async
    "F82",  # undefined names
]

[tool.mypy]
python_version = "3.10"
# The service entrypoint is src.main:app; src/ is a namespace package.
# Check from the worker root so relative imports resolve as src.* throughout:
#   cd apps/parser-worker && mypy --explicit-package-bases --namespace-packages src
# Cover every runtime module, including the native subprocess entrypoints.
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
# Baseline: surface real type errors, do not require annotations everywhere.
# warn_unused_ignores is off so existing `# type: ignore` comments kept for
# older typing edge cases do not fail the gate.
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false
no_implicit_optional = true
exclude = ["(?x)(\\.venv|__pycache__|tests/)"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
